x-backend-common: &backend-common
  image: quant-platform-backend:latest
  build:
    context: ./backend
  env_file:
    - ./backend/.env
  environment:
    ENV: prod
    DEBUG: "false"
    DB__HOST: postgres
    DB__PORT: 5432
    DB__USER: ${DB_USER}
    DB__PASSWORD: ${DB_PASSWORD}
    DB__DATABASE: ${DB_NAME}
    REDIS__HOST: redis
    REDIS__PORT: 6379
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3002","http://127.0.0.1:3002"]}'
    MOOTDX_SERVER: ${MOOTDX_SERVER:-110.41.147.114:7709}
  init: true

services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend-common
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  market-worker:
    <<: *backend-common
    command: ["python", "workers/market_worker/main.py"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  strategy-worker:
    <<: *backend-common
    command: ["python", "workers/strategy_worker/scheduler.py"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  trade-executor:
    <<: *backend-common
    command: ["python", "workers/trade_executor/adapters/main.py"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: quant-platform-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/market}
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
